spring.application.name=store-rating
server.port=8080

# MySQL - change username/password to match your local setup
spring.datasource.url=jdbc:mysql://localhost:3306/store_rating?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (secret must be at least 32 characters)
app.jwt.secret=change-this-secret-key-to-a-long-random-string-before-deploying
app.jwt.expiration-ms=86400000

app.cors.allowed-origin=http://localhost:5173

# Default system administrator, created on first start if no admin exists
app.admin.email=admin@storerating.com
app.admin.password=Admin@123
